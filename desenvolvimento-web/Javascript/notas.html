<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="container">

        <h1>Minhas Notas</h1>

        <!-- passo 1: criar a entrada -->

        <div class="entrada">

            <input type="text" id="nota" placeholder="digite uma nota...">
            <button id="btnAdicionar">adicionar</button>
            <button id="btnApagar">Apagar tudo</button>


        </div>

        <!-- passo 2: apresentar as notas -->

        <ul id="listaNotas">
            <!-- Vazia -->
        </ul>

    </div>

    <script>

        // elementos html

        const listaNotas = document.querySelector('#listaNotas');

       const campoNota = document.querySelector('#nota');

       const btnAdicionar = document.querySelector('#btnAdicionar');

       const btnApagar = document.querySelector('#btnApagar');

       // CARREGAR NOTAS

       let notas = JSON.parse(
        localStorage.getItem('notas')
       )

       if(notas == null){
        notas = [];
       }

       // ADICIONAR NOTAS

       function adicionarNota(){

            const texto = campoNota.value.trim();

            if(texto == ""){
                alert('digite alguma coisa!!!!!!');
                return;
            }

            const novaNota = {
                texto: texto ,
                concluida : false
            }

            notas.push(novaNota);

            localStorage.setItem(
                'notas' ,
                JSON.stringify(notas)
            );

            campoNota.value = ''

            exibirNotas();

       }

       // EXIBIR NOTAS

       function exibirNotas(){

            listaNotas.innerHTML = '';

            if( notas.lenght = 0){

                listaNotas.textContent = 'nunhuma nota cadastrada'

                return;

            }

            notas.forEach(function(nota , indice) {

                const item = document.createElement('li');

                const texto = document.createElement('span');
                texto.textContent = nota.texto;

                texto.classList.add('texto-nota');

                if(nota.concluida){
                    texto.classList.add('concluida');
                }

                const btnRemover = document.createElement('button');

                btnRemover.textContent = 'Remover';
                
                btnRemover.addEventListener('click' , function(){
                    removerNota(indice);
                   });

                item.appendChild(texto);
                item.appendChild(btnRemover);
                listaNotas.appendChild(item);
            })
            };

       // REMOVERNOTA

       function removerNota(indice){

            notas.splice(indice,1);

            localStorage.setItem(
                "notas" ,
                JSON.stringify(notas)
            );

            exibirNotas();

       }

       // apagar tudo

       function apagarNotas(){
            notas = [];

            localStorage.setItem(
                "notas" ,
                JSON.stringify(notas)
            );

          exibirNotas();
       }

       // EVENTOS

       btnAdicionar.addEventListener('click' , adicionarNota)

       btnApagar.addEventListener('click' , apagarNotas)
      

       exibirNotas();


    </script>


</body>
</html>
